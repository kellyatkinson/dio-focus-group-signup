name: Keep Supabase Warm

# Free Supabase projects pause after 7 days of inactivity. This workflow
# pings Supabase once a day so it stays awake while responses are open.

on:
  schedule:
    # 14:00 UTC = 02:00 NZST. During daylight saving this is a little later.
    # Cadence is what matters; exact local time isn't critical.
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set."
            exit 1
          fi
          # /auth/v1/health needs the apikey header (it's not as "open" as it
          # sounds). With apikey it returns 200 and exercises GoTrue + db.
          health=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Auth health: $health"
          if [ "$health" -ge 400 ]; then
            echo "::error::Supabase auth health returned HTTP $health"
            exit 1
          fi
          # Also exercise PostgREST, which is the path the app actually uses.
          rpc=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "PostgREST ping: $rpc"
          # We expect 401/403 (anon cannot read settings) or 200; all prove
          # the API path is awake. We only fail on 5xx or 0 (network).
          if [ "$rpc" -ge 500 ] || [ "$rpc" -eq 0 ]; then
            echo "::error::Supabase RPC ping returned HTTP $rpc"
            exit 1
          fi
