<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Group Scheduler - Admin</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%231d3b6d'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial,sans-serif' font-size='56' font-weight='700' fill='white'%3EF%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <h1>Focus Group Scheduler - Admin</h1>
  <div class="topbar-actions">
    <a href="/">Availability view</a>
    <span id="admin-email"></span>
    <button id="signout-btn" type="button">Sign out</button>
  </div>
</header>

<main>
  <div id="loading" class="page-band">Loading...</div>
  <section id="not-admin" class="page-band hidden">
    <h2 class="page-title">Not authorised</h2>
    <p class="subtle">Your account is signed in, but it is not in the admin list.</p>
  </section>

  <section id="admin-content" class="hidden">
    <div id="summary" class="summary"></div>

    <section class="panel">
      <div class="panel-header">
        <h2>Responses</h2>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search name, email, or group">
          <button id="refresh-btn" class="secondary" type="button">Refresh</button>
          <button id="export-responses-btn" class="secondary" type="button">Export responses CSV</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="group-results" class="admin-grid"></div>
      </div>
    </section>

    <section class="panel" style="margin-top:18px">
      <div class="panel-header">
        <h2>Respondents</h2>
      </div>
      <div id="respondent-table" class="panel-body"></div>
    </section>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
