<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Group Scheduler</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%231d3b6d'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial,sans-serif' font-size='56' font-weight='700' fill='white'%3EF%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <h1 id="app-title">Focus Group Scheduler</h1>
  <div class="user-bar" id="user-bar"></div>
</header>

<main>
  <div id="loading" class="page-band">Loading...</div>

  <section id="signin-view" class="signin page-band hidden">
    <div class="mark">F</div>
    <h2 class="page-title">Focus group availability</h2>
    <p id="signin-copy">Sign in with your organisation account to submit your availability.</p>
    <button id="google-signin" class="primary" type="button">Sign in with Google</button>
    <p class="meta-line" id="domain-copy"></p>
  </section>

  <section id="app-view" class="hidden">
    <div id="closed-card" class="closed-card hidden"></div>
    <div id="final-card" class="final-card hidden"></div>

    <div class="split">
      <form id="availability-form" class="stack">
        <section class="panel">
          <div class="panel-header">
            <h2>Your group</h2>
          </div>
          <div class="panel-body">
            <div id="group-grid" class="group-grid"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Your availability by time</h2>
            <span class="meta-line" id="time-count"></span>
          </div>
          <div class="panel-body">
            <div id="time-grid" class="time-grid"></div>
            <div class="actions">
              <button id="save-btn" class="primary" type="submit">Save availability</button>
              <button id="clear-btn" class="secondary" type="button">Mark all unavailable</button>
            </div>
          </div>
        </section>
      </form>

      <aside class="stack">
        <section id="saved-card" class="saved-card hidden"></section>
        <section class="panel">
          <div class="panel-header">
            <h2>Submission</h2>
          </div>
          <div class="panel-body stack">
            <p class="subtle" id="status-copy">Choose your group, then mark each time as available, if needed, or unavailable.</p>
            <p class="meta-line" id="cutoff-copy"></p>
          </div>
        </section>
      </aside>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
